apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: python-backend
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - python

  selector:
    matchLabels:
      app: backend

  endpoints:
    - port: http
      path: /metrics
      interval: 30s