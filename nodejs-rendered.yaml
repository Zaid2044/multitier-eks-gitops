---
# Source: nodejs-app/templates/nginx-configmap.yaml
apiVersion: v1
kind: ConfigMap

metadata:
  name: nginx-config

data:
  nginx.conf: |
    upstream backend {
        server backend:3000;
    }

    upstream frontend {
        server frontend:8080;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend;
        }

        location ~ ^/(metrics|health)$ {
            proxy_pass http://backend;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
---
# Source: nodejs-app/templates/backend-service.yaml
apiVersion: v1
kind: Service

metadata:
  name: backend

spec:
  selector:
    app: backend

  ports:
  - port: 3000
    targetPort: 3000
---
# Source: nodejs-app/templates/frontend-service.yaml
apiVersion: v1
kind: Service

metadata:
  name: frontend

spec:
  selector:
    app: frontend

  ports:
  - port: 8080
    targetPort: 8080
---
# Source: nodejs-app/templates/nginx-service.yaml
apiVersion: v1
kind: Service

metadata:
  name: nginx

spec:
  selector:
    app: nginx

  ports:
  - port: 80
    targetPort: 80
---
# Source: nodejs-app/templates/postgres-service.yaml
apiVersion: v1
kind: Service

metadata:
  name: postgres

spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432
---
# Source: nodejs-app/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: "234273295663.dkr.ecr.ap-south-1.amazonaws.com/nodejs-backend:latest"

        ports:
        - containerPort: 3000

        env:
        - name: NODE_ENV
          value: production

        - name: PORT
          value: "3000"

        - name: DB_HOST
          value: postgres

        - name: DB_PORT
          value: "5432"

        - name: DB_NAME
          value: taskflow

        - name: DB_USER
          value: taskflow_user

        - name: DB_PASSWORD
          value: taskflow_pass

        readinessProbe:
          httpGet:
            path: /health
            port: 3000

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
---
# Source: nodejs-app/templates/frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend

        image: "234273295663.dkr.ecr.ap-south-1.amazonaws.com/nodejs-frontend:latest"

        ports:
        - containerPort: 8080
---
# Source: nodejs-app/templates/nginx-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx

        image: nginx:1.25-alpine

        ports:
        - containerPort: 80

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf

      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
# Source: nodejs-app/templates/postgres-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
      - name: postgres

        image: postgres:16-alpine

        ports:
        - containerPort: 5432

        env:
        - name: POSTGRES_DB
          value: taskflow

        - name: POSTGRES_USER
          value: taskflow_user

        - name: POSTGRES_PASSWORD
          value: taskflow_pass

        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres

  volumeClaimTemplates:
  - metadata:
      name: postgres-storage

    spec:
      accessModes:
      - ReadWriteOnce

      storageClassName: gp2

      resources:
        requests:
          storage: 5Gi
---
# Source: nodejs-app/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: nodejs-ingress

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: nginx
                port:
                  number: 80
