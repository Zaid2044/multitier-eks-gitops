apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: java-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/<YOUR_GITHUB_USERNAME>/multitier-eks-gitops.git
    targetRevision: main
    path: helm/java-app

  destination:
    server: https://kubernetes.default.svc
    namespace: java

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true