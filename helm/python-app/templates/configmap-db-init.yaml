        ('LED Desk Lamp',        'Wireless charging base, 5 brightness levels',     'Electronics', 11,   79.99)
    ON CONFLICT (name) DO NOTHING;

    DO $$
    BEGIN
        RAISE NOTICE 'Database initialized successfully. Product count: %',
            (SELECT COUNT(*) FROM products);
    END
    $$;