apiVersion: v1
kind: ConfigMap

metadata:
  name: postgres-init

data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS products (
        id          SERIAL PRIMARY KEY,
        name        VARCHAR(200) NOT NULL UNIQUE,
        description TEXT,
        category    VARCHAR(100),
        quantity    INTEGER NOT NULL DEFAULT 0 CHECK (quantity >= 0),
        price       DOUBLE PRECISION NOT NULL DEFAULT 0.0 CHECK (price >= 0),
        created_at  TIMESTAMP NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMP NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS ix_products_category
    ON products (category);

    INSERT INTO products (name, description, category, quantity, price)
    VALUES
        ('MacBook Pro 14"',      'Apple M3 Pro chip, 18GB RAM, 512GB SSD',          'Electronics', 12, 1999.00),
