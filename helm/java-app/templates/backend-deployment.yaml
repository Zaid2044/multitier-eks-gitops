apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"

          ports:
            - containerPort: 8080

          env:
            - name: DB_URL
              value: "jdbc:postgresql://database:5432/employee_portal"

            - name: DB_USERNAME
              value: "employee_app"

            - name: DB_PASSWORD
              value: "employee_secret"

            - name: DB_POOL_SIZE
              value: "10"

            - name: DEMO_DATA_ENABLED
              value: "true"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60